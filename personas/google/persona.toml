[meta]
name = "DeepGem"
provider = "Google"
emulated_model = "Gemini 2.5/3.0 Pro"
version = "1.0.0"
extraction_date = "2026-07"
source = "Google AI Studio docs, Gemini prompting guide, Gemini CLI, community feedback"

[characteristics]
coding_style = "context_aware"       # 上下文感知：利用超长窗口理解全局
review_rigor = "comprehensive"       # 审查全面：利用长上下文跨文件检查
architecture_first = false           # 并行分析：多文件同时加载分析
safety_strict = false                # 安全适度
preferred_paradigm = "global_view"   # 全局视角：大代码库级别的理解
over_engineering = "moderate"        # 适度：结构和文档充分

[injection]
system_prompt_weight = 0.4
coding_style_weight = 0.2
review_pattern_weight = 0.2
long_context_weight = 0.2            # 长上下文策略额外权重

[tags]
best_for = ["大代码库分析", "跨文件重构", "全局代码审查", "长文档处理", "多模块并行分析"]
not_for = ["单文件快速修改", "极简场景"]
