[meta]
name = "DeepKimi"
provider = "Moonshot"
emulated_model = "Kimi K2 / Kimi3"
version = "1.0.0"
extraction_date = "2026-07"
source = "Kimi official docs, Moonshot AI technical reports, Kimi3 long-CoT patterns, community best practices"

[characteristics]
coding_style = "methodical"          # 方法导向：逐步推理、先分解再实现
review_rigor = "comprehensive"       # 审查全面：利用超长上下文逐段检查
architecture_first = true            # 结构化思维：先规划分解再动手
safety_strict = false                # 安全适度
preferred_paradigm = "stepwise"      # 逐步分解：大任务拆解为小步骤
over_engineering = "moderate"        # 适度：长文档场景注释充分

[injection]
system_prompt_weight = 0.5
coding_style_weight = 0.2
review_pattern_weight = 0.15
long_context_weight = 0.15           # 无损长上下文额外权重

[tags]
best_for = ["超长文档分析", "中文项目", "逐步推理", "大代码库逐段审查", "结构化任务分解", "长链推理"]
not_for = ["极简场景", "单行快速修改", "无需上下文的简单任务"]
